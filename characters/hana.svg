<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Hana the Hummingbird -->
  <!-- Wing back -->
  <path d="M48 40 C34 20 22 24 20 34 C26 38 38 46 48 44 Z" fill="#009BD9" stroke="#2D2200" stroke-width="2.5"/>
  <!-- Body -->
  <ellipse cx="54" cy="56" rx="22" ry="18" fill="#00B4D8" stroke="#2D2200" stroke-width="3" transform="rotate(-15 54 56)"/>
  <!-- Throat / Chest -->
  <path d="M48 44 Q56 46 64 54 Q56 64 46 60 Z" fill="#F2B800" stroke="#2D2200" stroke-width="2"/>
  <!-- Head -->
  <circle cx="68" cy="42" r="14" fill="#009BD9" stroke="#2D2200" stroke-width="3"/>
  <!-- Cheeks -->
  <circle cx="66" cy="46" r="3" fill="#E52311" opacity="0.3"/>
  <!-- Eyes -->
  <circle cx="70" cy="40" r="3.5" fill="#2D2200"/>
  <circle cx="71" cy="39" r="1.2" fill="#FFFFFF"/>
  <!-- Beak -->
  <path d="M80 43 L96 46 L80 47 Z" fill="#2D2200"/>
  <!-- Wing front -->
  <path d="M44 52 C30 38 18 44 14 54 C24 54 36 58 44 52 Z" fill="#F2B800" stroke="#2D2200" stroke-width="2.5"/>
  <!-- Tail -->
  <polygon points="34,64 22,76 28,78 38,68" fill="#0077B6" stroke="#2D2200" stroke-width="2"/>
</svg>
