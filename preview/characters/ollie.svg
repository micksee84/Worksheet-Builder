<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Ollie the Owl -->
  <!-- Ear tufts -->
  <polygon points="26,16 38,32 18,34" fill="#6A4E36" stroke="#2D2200" stroke-width="3" stroke-linejoin="round"/>
  <polygon points="74,16 82,34 62,32" fill="#6A4E36" stroke="#2D2200" stroke-width="3" stroke-linejoin="round"/>
  <!-- Body/Head -->
  <ellipse cx="50" cy="56" rx="34" ry="36" fill="#88684A" stroke="#2D2200" stroke-width="3.5"/>
  <!-- Belly -->
  <ellipse cx="50" cy="68" rx="22" ry="20" fill="#F2F2E2" stroke="#2D2200" stroke-width="2"/>
  <path d="M42 66 Q46 70 50 66 Q54 70 58 66" stroke="#88684A" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M45 74 Q50 78 55 74" stroke="#88684A" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Eye rings -->
  <circle cx="36" cy="46" r="14" fill="#FFFFFF" stroke="#2D2200" stroke-width="3"/>
  <circle cx="64" cy="46" r="14" fill="#FFFFFF" stroke="#2D2200" stroke-width="3"/>
  <!-- Pupils -->
  <circle cx="37" cy="46" r="6" fill="#2D2200"/>
  <circle cx="39" cy="44" r="2" fill="#FFFFFF"/>
  <circle cx="63" cy="46" r="6" fill="#2D2200"/>
  <circle cx="65" cy="44" r="2" fill="#FFFFFF"/>
  <!-- Beak -->
  <polygon points="50,49 44,57 56,57" fill="#F2B800" stroke="#2D2200" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Cheeks -->
  <ellipse cx="22" cy="54" rx="4" ry="3" fill="#E52311" opacity="0.3"/>
  <ellipse cx="78" cy="54" rx="4" ry="3" fill="#E52311" opacity="0.3"/>
</svg>
